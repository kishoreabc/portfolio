<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- K Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- K Top Arm Gradient -->
    <linearGradient id="armTopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- K Bottom Arm Gradient -->
    <linearGradient id="armBotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Subtle Inner Grid / Glow -->
  <circle cx="64" cy="64" r="38" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Left Vertical Stem -->
  <rect x="36" y="32" width="16" height="64" rx="8" fill="url(#stemGrad)" filter="url(#glow)" />

  <!-- Top Arm -->
  <path d="M46 64 L78 35" stroke="url(#armTopGrad)" stroke-width="15" stroke-linecap="round" filter="url(#glow)" />

  <!-- Bottom Arm -->
  <path d="M48 62 L82 94" stroke="url(#armBotGrad)" stroke-width="15" stroke-linecap="round" filter="url(#glow)" />

  <!-- AI Accent Node / Sparkle -->
  <circle cx="82" cy="33" r="5" fill="#38bdf8" />
  <circle cx="82" cy="33" r="2.5" fill="#ffffff" />
</svg>
